<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEB - Ujian dan Alat Bantu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .links {
            width: 420px;
            max-width: 90%;
            margin: auto;
        }

        .links a {
            display: block;
            padding: 16px;
            margin: 14px 0;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .links a:hover {
            background: #004999;
        }

        .exam {
            background: #198754;
        }

        .exam:hover {
            background: #146c43;
        }

        .note {
            margin-top: 28px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <h1>Ujian dan Alat Bantu</h1>

    <p>Silakan buka ujian terlebih dahulu, kemudian gunakan alat bantu yang diizinkan.</p>

    <div class="links">

        <!-- Jendela ujian utama -->
        <a class="exam"
           href="https://b.socrative.com/student-v2/join"
           target="_blank"
           rel="noopener noreferrer">
            Mulai Ujian — Socrative
        </a>

        <!-- Jendela alat bantu 1 -->
        <a href="https://www.desmos.com/"
           target="_blank"
           rel="noopener noreferrer">
            Kalkulator — Desmos
        </a>

        <!-- Jendela alat bantu 2 -->
        <a href="https://translate.google.ca/?sl=auto&tl=it&op=translate"
           target="_blank"
           rel="noopener noreferrer">
            Google Translate
        </a>

        <!-- Jendela alat bantu 3 -->
        <a href="https://khanacademy.org/"
           target="_blank"
           rel="noopener noreferrer">
            Khan Academy
        </a>

    </div>

    <div class="note">
        Semua tautan akan dibuka di jendela tambahan SEB.
    </div>

</body>
</html>
